apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: sales-training-pipeline

  annotations:
    scenarios.ai.sap.com/name: "Sales Prediction"
  # REMOVE this line:
  # executables.ai.sap.com/name: "Train Sales Model"
  # ADD THIS:
    executables.ai.sap.com/names: |
      train
      predict

  labels:
    scenarios.ai.sap.com/id: "sales-prediction-scenario"
    ai.sap.com/version: "1.1"

spec:
  entrypoint: train

  templates:
  
  - name: train
    container:
      image: docker.io/pranabparhi/sales-prediction-model:1
      command:
        - python
      args:
        - train.py

  - name: predict
    container:
      image: docker.io/pranabparhi/sales-prediction-model:2
      command:
        - python
      args:
        - predict.py
