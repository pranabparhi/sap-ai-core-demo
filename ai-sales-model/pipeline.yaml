apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: sales-training-pipeline

  annotations:
    scenarios.ai.sap.com/name: "Sales Prediction"

  labels:
    scenarios.ai.sap.com/id: "sales-prediction-scenario"
    ai.sap.com/version: "1.2"

spec:
  entrypoint: main

  templates:

    - name: main
      dag:
        tasks:
          - name: train
            template: train

          - name: predict
            template: predict
            dependencies: [train]

    - name: train
      container:
        image: docker.io/pranabparhi/sales-prediction-model:1
        command: ["python"]
        args: args: ["ai-sales-model/train.py"]

    - name: predict
      container:
        image: docker.io/pranabparhi/sales-prediction-model:2
        command: ["python"]
        args: ["ai-sales-model/predict.py"]
